[spec]
schema = "tilefoundry.cuda.architecture/v3"
kind = "architecture"
id = "nvidia.sm90"

[facts.identity.name]
value = "sm_90"
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "compilation architecture identity"

[facts.capabilities]
value = ["mma.sync", "wgmma.mma_async", "ldmatrix", "cp.async", "cp.async.bulk.tensor"]
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-compatibility-guide/index.html"
conditions = "PTX instruction families the SM90 code path may select"

[facts.instruction.compute_dtypes]
value = ["f32", "f16", "bf16", "fp8e4m3"]
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "dtypes with an SM90 compute instruction; f4e2m1 and f8e8m0 are storage and scale types, not compute types"

[facts.compute.max_threads_per_cta]
value = 1024
unit = "thread"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "SM90 CUDA programming limit"

[facts.compute.max_threads_per_warp]
value = 32
unit = "thread"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "architectural warp width"

[facts.compute.max_warps_per_cta]
value = 32
unit = "count"
origin = "derived"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "1024 threads per CTA divided by the 32-thread warp width"

[facts.compute.max_resident_ctas_per_sm]
value = 32
unit = "count"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "hardware maximum; resource usage can lower occupancy"

[facts.memory.shared.per_sm]
value = 233472
unit = "byte"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "228 KiB maximum shared-memory capacity per SM; unified L1 and shared-memory configuration"

[facts.memory.shared.per_cta]
value = 232448
unit = "byte"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "227 KiB maximum dynamic shared-memory allocation per CTA"

[facts.memory.shared.owner]
value = "cta"
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html#shared-memory"
conditions = "shared memory is allocated per thread block, the CUDA execution unit TileFoundry names cta"

[facts.memory.unified_l1_shared.per_sm]
value = 262144
unit = "byte"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html#compute-capabilities"
conditions = "256 KiB of unified data cache per SM on compute capability 9.0; the shared-memory carveout and the L1 data cache divide this one block between them"

[facts.memory.shared.bandwidth]
value = 128
unit = "byte/clock/sm"
origin = "reference"
source = "https://arxiv.org/abs/2402.13499"
conditions = "SM90 shared-memory ld/st microbenchmarks measured 127.9 B/clock/SM on H800, independently reproduced as 127.4 B/clock/SM; 128 is the corresponding 32-bank by 4-byte structural rate, not a vendor peak and not a rate for WGMMA or TMA ports"

[facts.memory.register.per_sm]
value = 65536
unit = "register"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
conditions = "SM90 maximum 32-bit register-file capacity per SM"

[facts.memory.register.owner]
value = "thread"
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html#variable-memory-space-specifiers"
conditions = "automatic variables ordinarily reside in a thread's private registers, the CUDA execution unit TileFoundry names thread"

[facts.memory.register.bandwidth]
status = "unavailable"
conditions = "NVIDIA publishes no static register-file bandwidth to use for a roofline."

[facts.memory.tensor.per_cta]
status = "unavailable"
conditions = "SM90 has no tensor-memory store: wgmma accumulates in the register file, so there is no separate capacity to state."

[facts.memory.tensor.owner]
value = "cta"
unit = "name"
origin = "derived"
source = "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-memory"
conditions = "where tensor memory exists its allocation is CTA-scoped; SM90 records no capacity because it has no tensor-memory store"
