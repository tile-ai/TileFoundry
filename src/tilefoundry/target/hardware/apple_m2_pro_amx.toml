[target]
name = "apple_m2_pro_amx"
device = "Apple M2 Pro"
architecture = "Apple AMX"

[facts.chip]
value = "Apple M2 Pro"
unit = ""
provenance = "measured"
conditions = "sysctl machdep.cpu.brand_string on the host"
source = "sysctl(8)"

[facts.performance_core_count]
value = 8
unit = "cores"
provenance = "measured"
conditions = "sysctl hw.perflevel0.physicalcpu"
source = "sysctl(8)"

[facts.efficiency_core_count]
value = 4
unit = "cores"
provenance = "measured"
conditions = "sysctl hw.perflevel1.physicalcpu"
source = "sysctl(8)"

[facts.l1d_per_performance_core]
value = 128
unit = "KiB"
provenance = "measured"
conditions = "sysctl hw.perflevel0.l1dcachesize; the unqualified hw.l1dcachesize reports the efficiency core's 64 KiB instead"
source = "sysctl(8)"

[facts.l1d_per_efficiency_core]
value = 64
unit = "KiB"
provenance = "measured"
conditions = "sysctl hw.perflevel1.l1dcachesize"
source = "sysctl(8)"

[facts.l2_per_performance_cluster]
value = 16
unit = "MiB"
provenance = "measured"
conditions = "sysctl hw.perflevel0.l2cachesize; shared by the performance cluster, not private to a core"
source = "sysctl(8)"

[facts.l2_per_efficiency_cluster]
value = 4
unit = "MiB"
provenance = "measured"
conditions = "sysctl hw.perflevel1.l2cachesize; the unqualified hw.l2cachesize reports this efficiency value instead"
source = "sysctl(8)"

[facts.cache_line]
value = 128
unit = "B"
provenance = "measured"
conditions = "sysctl hw.cachelinesize"
source = "sysctl(8)"

[facts.unified_memory_capacity]
value = 32
unit = "GiB"
provenance = "measured"
conditions = "sysctl hw.memsize = 34359738368 bytes"
source = "sysctl(8)"

[facts.unified_memory_bandwidth]
value = 200
unit = "GB/s"
provenance = "vendor-spec"
conditions = "published peak, decimal GB; not measured on this host"
source = "Apple M2 Pro product specification"

[facts.amx_x_register_file]
value = 512
unit = "B"
provenance = "direct"
conditions = "eight 64-byte X registers; Apple publishes no AMX documentation, so the geometry comes from a reverse-engineered reference"
source = "https://github.com/corsix/amx"

[facts.amx_y_register_file]
value = 512
unit = "B"
provenance = "direct"
conditions = "eight 64-byte Y registers"
source = "https://github.com/corsix/amx"

[facts.amx_z_register_file]
value = 4096
unit = "B"
provenance = "direct"
conditions = "sixty-four 64-byte Z rows; the accumulator file an outer product lands in"
source = "https://github.com/corsix/amx"

[facts.amx_f32_outer_product]
value = "16x16"
unit = "f32 elements"
provenance = "derived"
conditions = "one FMA32 multiplies a 64-byte X operand by a 64-byte Y operand: 16 by 16 f32"
source = "amx_x_register_file, amx_y_register_file"

[facts.amx_f32_accumulator_tile]
value = "32x32"
unit = "f32 elements"
provenance = "derived"
conditions = "4096 B of Z at 4 B per f32 is 1024 elements, which is 32 by 32"
source = "amx_z_register_file"

[facts.amx_f32_unit_throughput]
value = 504.9
unit = "GFLOP/s"
provenance = "measured"
conditions = "one AMX unit; M=N=K=512 f32 GEMM with Z-resident accumulation, single thread, warmed, best of five rounds on the host"
source = "AMX f32 GEMM benchmark on the host"

[facts.amx_unit_count]
value = 2
unit = "AMX units"
provenance = "estimated"
conditions = "read off measured thread scaling of the same GEMM: 504.9, 767.8, 967.5 and 1108.3 GFLOP/s at 1, 2, 4 and 8 threads, saturating at 2.2 times one thread; Apple publishes no AMX unit count"
source = "AMX f32 GEMM thread-scaling measurement on the host"

[facts.neon_f32_outer_product]
value = "4x4"
unit = "f32 elements"
provenance = "derived"
conditions = "four FMLA vD.4s, vN.4s, vM.s[i] over four accumulator registers are the smallest whole f32 outer product NEON issues"
source = "Arm A64 instruction set, FMLA (by element)"

[facts.neon_f32_core_throughput]
value = 107.7
unit = "GFLOP/s"
provenance = "measured"
conditions = "one performance core, single thread; M=N=K=512 f32 GEMM under a 4x16 micro-kernel (a 1x4 grid of 4x4 atoms, C register-resident over the whole K loop), panels pre-packed so the figure is the atom issue rate and not a packing cost, warmed, best of five rounds; result exact against Accelerate cblas_sgemm"
source = "NEON f32 GEMM benchmark on the host"

[facts.amx_f32_instruction_peak]
value = "unavailable"
unit = ""
provenance = "unavailable"
conditions = "Apple publishes no AMX instruction throughput; the measured sustained unit throughput is used for the roofline instead"
source = ""

[facts.compiler_policy_tile_capacity]
value = 128
unit = "KiB"
provenance = "derived"
conditions = "a core-level tile's resident working set is recorded against the performance core's L1d; the AMX register files bound one atom instance instead, and do so by filtering the candidate atoms of a statement that overflows them"
source = "tilefoundry policy"
