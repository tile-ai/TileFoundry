[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tilefoundry"
dynamic = ["version", "optional-dependencies"]
description = "A tile-based, agentic platform for automatic high-performance program generation across hardware."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tile-ai" }]
dependencies = [
    "isl-python>=0.1.10",
    "jinja2>=3.0",
    "apache-tvm-ffi",
    "torch>=2.7",  # DType.f8e8m0 -> torch.float8_e8m0fnu, added in torch 2.7
    "graphviz>=0.20",
    "transformers>=5.13,<5.15",
    "ortools>=9.15",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/tile-ai/TileFoundry"
Repository = "https://github.com/tile-ai/TileFoundry"

[project.scripts]
tilefoundry = "tilefoundry.cli:main"

[tool.coverage.run]
branch = false
core = "sysmon"
source = ["src", "targets"]

[tool.coverage.report]
skip_empty = true

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tilefoundry", "tilefoundry.*"]

[tool.setuptools.package-data]
"tilefoundry.runtime" = ["include/tilefoundry/runtime/cpu/*.h"]
"tilefoundry" = ["orchestrator/*/*.py"]
"tilefoundry.codegen" = ["templates/cmake/*.j2"]
"tilefoundry.codegen.cpu.templates" = ["*.j2"]

[tool.setuptools.data-files]
"share/tilefoundry/spec" = ["docs/spec/*.md"]
# Tutorial pages have distinct filenames, so one destination is sufficient.
"share/tilefoundry/tutorial" = ["docs/tutorial/*.md"]
[tool.pytest.ini_options]
# Parallel is how this suite is run, on CI (`-n 4`) and locally: conftest's
# DumpScope isolates per xdist worker and the compile workdir is pid-keyed. No
# addopts default, because the worker count is a property of the machine — the CI
# workflow states its own.
markers = [
    "no_dump: opt out of the autouse DumpScope for tests that emit excessive dump output",
]

[tool.ruff]
src = [".", "src", "targets/*"]
# Snapshot examples, shipped model sources, and recorded parser and printer output are
# evidence; formatting them changes that evidence.
extend-exclude = [
    "examples",
    # Ruff's * also matches /, so keep the harness directory exact.
    "tests/nvidia/cuda/models",
    "tests/core/models/decode_oracle.py",
    "tests/core/models/dense_decode.py",
    "targets/*/tilefoundry_*/*/models",
    "src/tilefoundry/orchestrator",
    "tests/parser/golden",
    "tests/*/*/fixtures/schedule/tir",
]
force-exclude = true
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected rule families:
#   E, W  pycodestyle (PEP 8 errors / warnings)
#   F     pyflakes    (unused / undefined / shadowed)
#   I     isort       (import order)
#   N     pep8-naming (docs/spec/code-organization.md S10)
# Plus targeted rules:
#   D100 D104      module and package docstrings (C9)
#   B006 B008      no mutable or call parameter defaults (S6)
#   PLC0415        import-outside-top-level (C1)
#   TID251         banned-api
select = ["E", "F", "W", "I", "D2", "D3", "D4", "D100", "D104", "B006", "B008", "N", "PLC0415", "TID251"]

# Ignored rules:
#   E501  line-too-long — long strings / compact code stay on one line.
#   F821  undefined-name — quoted forward-ref annotations like
#         ``def _(call: "Call", ctx: "TypeInferContext")`` use
#         Python-language forward-refs to break import cycles without
#         ``TYPE_CHECKING`` shims.
#   E741  ambiguous-variable-name — single-letter variables (``l`` /
#         ``r`` / ``a``) are allowed.
ignore = ["E501", "F821", "E741"]

[tool.ruff.lint.flake8-bugbear]
# S6: the option records are frozen, so a default may be one.
extend-immutable-calls = [
    "tilefoundry.codegen.Options",
    "tilefoundry.codegen.options.Options",
    "tilefoundry.passes.Options",
    "tilefoundry.passes.options.Options",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Use quoted forward references; TYPE_CHECKING shims are not used in TileFoundry."
"typing_extensions.TYPE_CHECKING".msg = "Use quoted forward references; TYPE_CHECKING shims are not used in TileFoundry."

[tool.ruff.lint.per-file-ignores]
# DSL tests use `from tilefoundry.dsl import *` as part of the
# authoring-surface ergonomics. Internal implementation code in
# `src/` uses explicit imports except for the curated DSL re-exports.
# The source rules of docs/spec/code-organization.md §0 bind src and targets only.
"tests/**/*.py" = ["F403", "F405", "D100", "D104", "B008", "N"]
"scripts/**/*.py" = ["D100", "D104", "B008", "N"]
"src/tilefoundry/dsl/__init__.py" = ["F403"]
# An __init__.py only re-exports, so its imports are its exports (C3).
"**/__init__.py" = ["F401"]
# The DSL requires `with Mesh(...) as name:` even when a fixture never reads the name.
"tests/**/fixtures/**/*.py" = ["F841"]
# The conftests of installed suites re-export the fixtures of tests/core/installed/conftest.py.
"tests/*/*/installed/conftest.py" = ["F401"]
# The fixture file re-exports ChildMatmulRoot so its namespace holds the CUDA root beside the CPU root.
"tests/nvidia/cuda/fixtures/dsl/child_matmul_cpu_root.py" = ["F401"]
# These conftests import torch late: the root one after xdist binds a device, the other only when an sm89 test runs.
"tests/conftest.py" = ["PLC0415"]
"tests/nvidia/conftest.py" = ["PLC0415"]
# The script puts its own directory on sys.path before importing its sibling script.
"scripts/finalize_plan_context.py" = ["E402"]
# The orchestrator templates import the user project's modules after argument parsing.
"src/tilefoundry/orchestrator/*/run.py" = ["PLC0415"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# S10: method names dispatched by reflection on a class name (``default_visit_T`` is the fallback of ``visit_T``), the ``refused_T`` / ``predicate_T`` / ``rules_T`` / ``alternatives_T`` readers of the pattern printer, the one-letter shard attribute constructors S, P, B and V of the DSL, and the formula constructors Bits, In, ForAll, Sum and Count of the pattern language.
ignore-names = ["visit_*", "visit_leaf_*", "default_visit_T", "print_*", "refused_*", "predicate_*", "rules_*", "alternatives_*", "S", "P", "B", "V", "Bits", "In", "ForAll", "Sum", "Count"]

[tool.code_organization]
# docs/spec/code-organization.md §0, checked by scripts/code_organization_lint.py. Every rule
# applies to every Python file; `src` names the first-party import roots, as in ruff.
src = ["src", "targets/nvidia", "targets/apple"]

[tool.code_organization.per-file-ignores]
# Shipped model sources, orchestrator templates and examples are copied into user projects.
"*/models/*" = ["ALL"]
"src/tilefoundry/orchestrator/*" = ["ALL"]
"examples/*" = ["ALL"]
# Tests and scripts are not imported as library code: only the import rules C10 and C11 bind them.
"tests/*" = ["S1", "S2", "S4", "S5", "S7", "S8", "S9", "S11", "C3", "C4", "C5", "C6"]
"scripts/*" = ["S1", "S2", "S4", "S5", "S7", "S8", "S9", "S11", "C3", "C4", "C5", "C6"]
"setup.py" = ["C3", "C4"]
"targets/*/setup.py" = ["C3", "C4"]
# ctypes requires the foreign structure descriptor to be named _fields_.
"targets/nvidia/tilefoundry_nvidia/cuda/nccl.py" = ["C4"]
# These tests import names from the shipped model sources, which follow no rule.
"tests/nvidia/cuda/analysis/test_analyze_cross_module.py" = ["C11"]
"tests/nvidia/cuda/fixtures/cli/nested_checkpoint.py" = ["C11"]
# The user entry points re-export names of other directories (D57, D58).
"src/tilefoundry/__init__.py" = ["C3", "C11"]
"src/tilefoundry/dsl/__init__.py" = ["C3", "C11"]
# Plugin loading points import modules by name.
"src/tilefoundry/target/registry.py" = ["S5"]
"src/tilefoundry/cli/target.py" = ["S5"]
"src/tilefoundry/utils/lazy.py" = ["S5"]

[tool.comment_hygiene]
# docs/spec/code-organization.md C8 and the documentation rules of scripts/comment_hygiene_lint.py.
max_prose_lines = 8
max_columns = 100
max_assert_message = 100
# Paths outside the placement and size checks.
exempt = [
    "tests/nvidia/cuda/models/",
    "tests/core/models/decode_oracle.py",
    "tests/core/models/dense_decode.py",
    "targets/nvidia/tilefoundry_nvidia/cuda/models/",
    "examples/",
    "src/tilefoundry/orchestrator/",
    # Canonical printer output; the TIR printer ends every launch line with a noqa comment.
    "tests/nvidia/cuda/fixtures/tir/",
]
# Comment prefixes that address a tool; every one is a violation (C8).
directive_prefixes = ["noqa", "type:", "pragma:", "ruff:", "pylint:", "pyright:", "mypy:", "fmt:", "isort:", "hygiene:"]
# Process narration that documentation must not carry: [pattern, what it is].
narration = [
    ['\bAC-\d+-\d+\b', "an acceptance-criterion id"],
    ['(?i)\bmilestones?\s+M\d+\b', "a milestone reference"],
    ['(?i)\bplans?\s+`?\d+`?\b', "a plan reference"],
    ['docs/plans/', "a plan path"],
    ['(?i)\b(?:PR|pull request|issue)\s*#?\d+\b', "a PR/issue reference"],
    ['(?i)\bcommit\s+[0-9a-f]{7,40}\b', "a commit hash"],
    ['(?i)\b(?:as discussed|per review|review(?:er)? (?:said|asked|wants|requested)|address(?:ed|ing) (?:the )?(?:review|feedback)|as agreed)\b', "review narration"],
]

[tool.importlinter]
# docs/spec/code-organization.md C2: the layer table of §0.5 and an acyclic import graph.
root_packages = ["tilefoundry", "tilefoundry_nvidia", "tilefoundry_apple"]
contract_types = ["acyclic: importlinter_acyclic.AcyclicContract"]

[[tool.importlinter.contracts]]
name = "C2 layers of tilefoundry (top row first)"
type = "layers"
containers = ["tilefoundry"]
layers = [
    "bootstrap",
    "dsl | cli",
    "compiler",
    "schedule | runtime",
    "codegen",
    "inspection | passes",
    "analysis | parser",
    "verifier",
    "ir.hir | ir.tir",
    "interfaces",
    "ir.core",
    "ir.clause | ir.pattern | core",
    "target",
    "ir.utils",
    "ir.dim",
    "ir.types",
    "ir.expr",
    "services",
    "dispatch | utils | dump",
]

[[tool.importlinter.contracts]]
name = "C2 target packages sit above tilefoundry"
type = "layers"
layers = ["tilefoundry_nvidia | tilefoundry_apple", "tilefoundry"]

[[tool.importlinter.contracts]]
name = "C2 acyclic module graph"
type = "acyclic"
ignore = ["tilefoundry.orchestrator", "tilefoundry.orchestrator.*", "tilefoundry_*.models", "tilefoundry_*.models.*"]
