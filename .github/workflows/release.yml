name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi-version:
        description: Exact TestPyPI version
        required: true
        default: 0.0.1
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: [self-hosted, tilefoundry]
    container: tilefoundry-ci-runner:local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare packaging environment
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade build twine
      - name: Build tag distributions
        if: github.event_name == 'push'
        run: .venv/bin/python -m build
      - name: Build TestPyPI distributions
        if: github.event_name == 'workflow_dispatch'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.testpypi-version }}
        run: .venv/bin/python -m build
      - name: Check distribution metadata
        run: .venv/bin/twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/project/tilefoundry/' || 'https://pypi.org/project/tilefoundry/' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish distributions to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
      - name: Publish distributions to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
