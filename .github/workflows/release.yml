name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Release destination
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - testpypi
      testpypi-version:
        description: Exact TestPyPI version; ignored by dry-run
        required: true
        default: 0.0.1
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, tilefoundry]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build tag or dry-run distributions
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'dry-run'
        run: python -m build
      - name: Build TestPyPI distributions
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.testpypi-version }}
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: [self-hosted, tilefoundry]
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      SDIST_DIR: ${{ runner.temp }}/release-sdist-${{ github.run_id }}-${{ github.run_attempt }}
      WHEEL_VENV: ${{ runner.temp }}/release-wheel-${{ github.run_id }}-${{ github.run_attempt }}
      SDIST_VENV: ${{ runner.temp }}/release-sdist-venv-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Link baked cutlass headers
        run: mkdir -p third_party/cutlass && ln -sf /opt/cutlass/include third_party/cutlass/include
      - name: Install packaging tools
        run: python -m pip install --upgrade build
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Verify the direct and sdist-derived wheels
        run: |
          mkdir -p "$EVIDENCE_DIR" "$SDIST_DIR/source" "$SDIST_DIR/dist"
          unzip -Z1 dist/*.whl | sort > "$EVIDENCE_DIR/wheel-payload.txt"
          tar -tzf dist/*.tar.gz | sort > "$EVIDENCE_DIR/sdist-payload.txt"

          python -m venv --system-site-packages "$WHEEL_VENV"
          "$WHEEL_VENV/bin/pip" install --no-deps dist/*.whl
          TF_SMOKE_VENV="$WHEEL_VENV" pytest tests/integration/installed \
            -o python_files='smoke_*.py' -q -n 4 --tb=short \
            --junitxml="$EVIDENCE_DIR/direct.xml" > "$EVIDENCE_DIR/direct.txt" 2>&1

          tar -xzf dist/*.tar.gz -C "$SDIST_DIR/source"
          source="$(find "$SDIST_DIR/source" -mindepth 1 -maxdepth 1 -type d -name 'tilefoundry-*' -print -quit)"
          python -m build --wheel --outdir "$SDIST_DIR/dist" "$source"
          python -m venv --system-site-packages "$SDIST_VENV"
          "$SDIST_VENV/bin/pip" install --no-deps "$SDIST_DIR"/dist/*.whl
          TF_SMOKE_VENV="$SDIST_VENV" pytest tests/integration/installed \
            -o python_files='smoke_*.py' -q -n 4 --tb=short \
            --junitxml="$EVIDENCE_DIR/sdist.xml" > "$EVIDENCE_DIR/sdist.txt" 2>&1
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn

  publish:
    needs: verify
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    runs-on: [self-hosted, tilefoundry]
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/project/tilefoundry/' || 'https://pypi.org/project/tilefoundry/' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish distributions to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
      - name: Publish distributions to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
