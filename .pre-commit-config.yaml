repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types_or: [python]
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: \.(h|hpp|cuh|cu|cpp|cc)$
      - id: spec-rules-lint
        name: spec-rules-lint
        entry: python scripts/spec_rules_lint.py
        language: system
        files: ^docs/spec/.*\.md$
      # Every place a reference is written. Kept off `docs/SPEC-RULES.md`, which
      # states the forbidden forms as examples and would report itself.
      - id: spec-refs-lint
        name: spec-refs-lint
        entry: python scripts/spec_refs_lint.py
        language: system
        files: ^(docs/spec/.*\.md|src/.*\.py|tests/.*\.py|include/.*\.(h|cuh))$
      - id: spec-entropy-lint
        name: spec-entropy-lint
        entry: python scripts/spec_entropy_lint.py
        language: system
        files: ^src/.*\.py$
      - id: forward-references
        name: forward-references
        entry: python scripts/forward_references_lint.py
        language: system
        types_or: [python]
      - id: comment-hygiene
        name: comment-hygiene
        entry: python scripts/comment_hygiene_lint.py
        language: system
        types_or: [python]
      - id: no-machine-paths
        name: no-machine-paths
        entry: python scripts/no_machine_paths_lint.py
        language: system
        exclude_types: [binary]
      - id: english-only
        name: english-only
        entry: python scripts/english_only_lint.py
        language: system
        exclude_types: [binary]
