[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tilefoundry-cuda"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["tilefoundry"]

[project.entry-points."tilefoundry.targets"]
cuda = "tilefoundry_cuda"

[tool.setuptools_scm]
root = "../.."

[tool.setuptools.packages.find]
where = ["."]
include = ["tilefoundry_cuda*"]

[tool.setuptools.package-data]
"tilefoundry_cuda" = ["docs/spec/*.md"]
"tilefoundry_cuda.codegen" = ["include/tilefoundry/runtime/cuda/**/*"]
"tilefoundry_cuda.codegen.templates" = ["*.j2"]
"tilefoundry_cuda.target.hardware" = ["*.toml"]
