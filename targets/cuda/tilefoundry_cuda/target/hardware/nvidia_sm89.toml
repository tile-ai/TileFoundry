[spec]
schema = "tilefoundry.cuda.architecture/v3"
kind = "architecture"
id = "nvidia.sm89"

[facts.identity.name]
value = "sm_89"
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/ada-tuning-guide/index.html"
conditions = "compilation architecture identity"

[facts.capabilities]
value = ["mma.sync", "ldmatrix", "cp.async"]
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html"
conditions = "PTX instruction families the SM89 code path may select; wgmma.mma_async requires sm_90a and cp.async.bulk.tensor requires sm_90, so neither is listed"

[facts.instruction.compute_dtypes]
value = ["f32", "f16", "bf16", "fp8e4m3"]
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html"
conditions = "dtypes with an SM89 compute instruction; the e4m3 mma requires sm_89 or higher; f4e2m1 and f8e8m0 are storage and scale types, not compute types"

[facts.compute.max_threads_per_cta]
value = 1024
unit = "thread"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/cuda-programming-guide/05-appendices/compute-capabilities.html"
conditions = "maximum number of threads per block at compute capability 8.9"

[facts.compute.max_threads_per_warp]
value = 32
unit = "thread"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/cuda-programming-guide/05-appendices/compute-capabilities.html"
conditions = "architectural warp width"

[facts.compute.max_warps_per_cta]
value = 32
unit = "count"
origin = "derived"
source = "https://docs.nvidia.com/cuda/cuda-programming-guide/05-appendices/compute-capabilities.html"
conditions = "1024 threads per CTA divided by the 32-thread warp width"

[facts.compute.max_resident_ctas_per_sm]
value = 24
unit = "count"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/ada-tuning-guide/index.html"
conditions = "hardware maximum; resource usage can lower occupancy"

[facts.memory.shared.per_sm]
value = 102400
unit = "byte"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/ada-tuning-guide/index.html"
conditions = "100 KiB maximum shared-memory capacity per SM; unified L1 and shared-memory configuration"

[facts.memory.shared.per_cta]
value = 101376
unit = "byte"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/ada-tuning-guide/index.html"
conditions = "99 KiB maximum dynamic shared-memory allocation per CTA; static allocations remain limited to 48 KiB"

[facts.memory.shared.owner]
value = "cta"
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html#shared-memory"
conditions = "shared memory is allocated per thread block, the CUDA execution unit TileFoundry names cta"

[facts.memory.unified_l1_shared.per_sm]
value = 131072
unit = "byte"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/ada-tuning-guide/index.html"
conditions = "128 KiB combined L1 cache capacity per SM; the shared-memory carveout and the L1 data cache divide this one block between them"

[facts.memory.shared.bandwidth]
status = "unavailable"
conditions = "No published or cited shared-memory bandwidth for compute capability 8.9 is recorded."

[facts.memory.register.per_sm]
value = 65536
unit = "register"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/ada-tuning-guide/index.html"
conditions = "SM89 maximum 32-bit register-file capacity per SM"

[facts.memory.register.owner]
value = "thread"
unit = "name"
origin = "vendor"
source = "https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html#variable-memory-space-specifiers"
conditions = "automatic variables ordinarily reside in a thread's private registers, the CUDA execution unit TileFoundry names thread"

[facts.memory.register.bandwidth]
status = "unavailable"
conditions = "NVIDIA publishes no static register-file bandwidth to use for a roofline."

[facts.memory.tensor.per_cta]
status = "unavailable"
conditions = "SM89 has no tensor-memory store: mma.sync accumulates in the register file, so there is no separate capacity to state."

[facts.memory.tensor.owner]
value = "cta"
unit = "name"
origin = "derived"
source = "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-memory"
conditions = "where tensor memory exists its allocation is CTA-scoped; SM89 records no capacity because it has no tensor-memory store"
