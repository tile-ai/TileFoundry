[spec]
schema = "tilefoundry.cuda.device/v3"
kind = "device"
id = "nvidia.rtx_6000_ada"

[compatibility]
architectures = ["nvidia.sm89"]

[facts.identity.name]
value = "rtx_6000_ada"
unit = "name"
origin = "vendor"
source = "https://www.nvidia.com/en-us/design-visualization/rtx-6000/"
conditions = "product identity of the RTX 6000 Ada Generation workstation card"

[facts.compute.sm_count]
value = 142
unit = "count"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/pdf/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1_1.pdf"
conditions = "RTX 6000 Ada Generation column of Appendix A, Table 4"

[facts.compute.sm_clock_hz]
value = 2506051936
unit = "Hz"
origin = "derived"
source = "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/index.html#throughput-of-native-arithmetic-instructions"
conditions = "effective SM clock implied by the existing dense FP32 peak and SM count: 91.1e12 FLOP/s / (142 SM * 128 FP32 results/clock/SM * 2 FLOP/result)"

[facts.memory.hbm.capacity]
value = 48000000000
unit = "byte"
origin = "vendor"
source = "https://www.nvidia.com/en-us/design-visualization/rtx-6000/"
conditions = "48 GB GDDR6 with ECC, decimal; recorded under the hbm key, which names the device's global memory whatever its technology"

[facts.memory.hbm.owner]
value = "target"
unit = "name"
origin = "derived"
source = "https://www.nvidia.com/en-us/design-visualization/rtx-6000/"
conditions = "the stated GDDR6 capacity is one pool shared by all execution units of this single-device target"

[facts.memory.hbm.bandwidth]
value = 960000000000
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/rtx-6000/proviz-print-rtx6000-datasheet-web-2504660.pdf"
conditions = "960 GB/s peak GDDR6 bandwidth over a 384-bit interface, decimal"

[facts.memory.gmem.latency]
status = "unavailable"
conditions = "No cited global-memory load latency is recorded for this product, so no per-CTA in-flight bandwidth cap applies."

[facts.memory.l2.capacity]
value = 100663296
unit = "byte"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/pdf/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1_1.pdf"
conditions = "98304 KB in Appendix A, Table 4, with KB = 1024 bytes"

[facts.memory.l2.bandwidth]
status = "unavailable"
conditions = "NVIDIA publishes no static L2 bandwidth to use for a roofline."

[facts.throughput.f32]
value = 91100000000000
unit = "flop/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/rtx-6000/proviz-print-rtx6000-datasheet-web-2504660.pdf"
conditions = "91.1 TFLOP/s dense FP32 at the GPU Boost Clock"

[facts.throughput.f16]
value = 364000000000000
unit = "flop/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/pdf/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1_1.pdf"
conditions = "dense FP16 tensor peak with FP32 accumulate, Appendix A, Table 4; the 728 TFLOP/s beside it is the sparse figure"

[facts.throughput.bf16]
value = 364000000000000
unit = "flop/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/pdf/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1_1.pdf"
conditions = "dense BF16 tensor peak with FP32 accumulate, Appendix A, Table 4; the 728 TFLOP/s beside it is the sparse figure"

[facts.throughput.fp8e4m3]
value = 728500000000000
unit = "flop/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/pdf/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1_1.pdf"
conditions = "dense FP8 tensor peak with FP32 accumulate, Appendix A, Table 4; the 1457 TFLOP/s beside it, which the product datasheet also states, is the sparse figure"

[facts.throughput.f4e2m1]
status = "unavailable"
conditions = "The Ada tensor cores have no FP4 mode, so this product has no FP4 peak rather than an unpublished one."

[facts.service.integer]
value = 160387323904
unit = "op/s"
origin = "derived"
source = "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/index.html#throughput-of-native-arithmetic-instructions"
conditions = "64 results/clock/SM at compute capability 8.9, times facts.compute.sm_clock_hz, stated per CTA. 64 rather than the 128 of integer add, because multiply, shift and bitwise are 64 and one envelope covers the family. A peak-style analytical throughput, not a measured calibration."

[facts.service.predicate]
value = 160387323904
unit = "op/s"
origin = "derived"
source = "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/index.html#throughput-of-native-arithmetic-instructions"
conditions = "The same conservative scalar-service envelope as integer: 64 results/clock/SM times facts.compute.sm_clock_hz, per CTA. A comparison is issued as a scalar proxy rather than rated on its own line. A peak-style analytical throughput, not a measured calibration."

[facts.service.select]
value = 160387323904
unit = "op/s"
origin = "derived"
source = "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/index.html#throughput-of-native-arithmetic-instructions"
conditions = "The same conservative scalar-service envelope as integer: 64 results/clock/SM times facts.compute.sm_clock_hz, per CTA. A select is issued as a scalar proxy rather than rated on its own line. A peak-style analytical throughput, not a measured calibration."

[facts.service.special]
value = 40096830976
unit = "op/s"
origin = "derived"
source = "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/index.html#throughput-of-native-arithmetic-instructions"
conditions = "16 results/clock/SM at compute capability 8.9 for the row the table states as 32-bit approximate floating-point reciprocal, reciprocal square root, base-2 logarithm and base-2 exponential, times facts.compute.sm_clock_hz, per CTA. The name is this project's, not the vendor's: the table names the instructions rather than a service. The native approximate peak; a full-precision math path may be slower. A peak-style analytical throughput, not a measured calibration."
