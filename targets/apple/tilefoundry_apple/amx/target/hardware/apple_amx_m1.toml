[spec]
schema = "tilefoundry.amx.architecture/v2"
kind = "architecture"
id = "apple.amx_m1"

[facts.identity.name]
value = "apple_amx_m1"
unit = "name"
origin = "reference"
source = "https://github.com/corsix/amx"
conditions = "Apple publishes no AMX documentation, so the architecture is described from a reverse-engineered reference"

[facts.capabilities]
value = [
    "amx_set",
    "amx_clr",
    "amx_ldx_v1",
    "amx_ldy_v1",
    "amx_ldz",
    "amx_ldzi",
    "amx_stx",
    "amx_sty",
    "amx_stz",
    "amx_stzi",
    "amx_fma16",
    "amx_fma32",
    "amx_fma64",
    "amx_fms16",
    "amx_fms32",
    "amx_fms64",
    "amx_mac16",
    "amx_matfp_v1",
    "amx_vecfp_v1",
    "amx_matint_v1",
    "amx_vecint_v1",
    "amx_extrx_v1",
    "amx_extry_v1",
    "amx_genlut_v1",
]
unit = "name"
origin = "reference"
source = "https://github.com/corsix/amx/blob/main/emulate.h; https://github.com/corsix/amx/blob/main/README.md; https://github.com/corsix/amx"
conditions = "M1 instruction semantics from the original C emulator: 15 unchanged instruction capabilities and nine statically versioned capabilities, selecting 24 of the 39 registered Ops. Version suffixes identify distinct instruction semantics, not Apple official ISA version numbers. This is reference-derived capability data, not native hardware measurement or a loadability claim."

[facts.instruction.compute_dtypes]
value = ["f16", "f32", "f64", "i8", "u8", "i16", "u16", "i32", "u32"]
unit = "name"
origin = "reference"
source = "https://github.com/corsix/amx"
conditions = "compute dtypes admitted by the M1 static instruction catalogue; each selected instruction Pattern checks its legal operand tuples"

[facts.compute.units_per_core]
value = 1
unit = "count"
origin = "reference"
source = "https://github.com/corsix/amx"
conditions = "one AMX coprocessor issues for one core at a time"

[facts.register.x_file]
value = 512
unit = "byte"
origin = "reference"
source = "https://github.com/corsix/amx"
conditions = "eight 64-byte X registers, the staging file one operand lands in"

[facts.register.y_file]
value = 512
unit = "byte"
origin = "reference"
source = "https://github.com/corsix/amx"
conditions = "eight 64-byte Y registers, the staging file the other operand lands in"

[facts.register.z_file]
value = 4096
unit = "byte"
origin = "reference"
source = "https://github.com/corsix/amx"
conditions = "sixty-four 64-byte Z rows; the accumulator file an outer product lands in"

[facts.register.owner]
value = "amx"
unit = "name"
origin = "reference"
source = "https://github.com/corsix/amx"
conditions = "the X, Y, and Z files belong to one AMX coprocessor, the execution unit TileFoundry names amx"

[facts.geometry.f32_outer_product]
value = "16x16"
unit = "element"
origin = "derived"
source = "https://github.com/corsix/amx"
conditions = "one FMA32 multiplies a 64-byte X operand by a 64-byte Y operand: 16 by 16 f32"

[facts.geometry.f32_accumulator_tile]
value = "32x32"
unit = "element"
origin = "derived"
source = "https://github.com/corsix/amx"
conditions = "4096 B of Z at 4 B per f32 is 1024 elements, which is 32 by 32"

[facts.throughput.f32_instruction_peak]
status = "unavailable"
conditions = "Apple publishes no AMX instruction throughput; the measured sustained unit throughput on the device is used for the roofline instead."
